tasks.named("preBuild").configure {
    dependsOn("compileCameraVertexShader", "compileCameraFragmentShader",
            "compileDownsample4To2Shader", "compileDownsample4To3Shader", "compileDownsample3To2Shader",
            "compileDownsample1To1Shader", "compileResizePlaneShader", "compileYuv420To444Shader",
            "compileSobel6PixelsShader", "compileMedianV2Shader",
            "compileOptimizedSobelShader", "compileOptimizedMedianShader")
}

android {
    namespace 'app.builderx.ogfa.camerapipelinetest'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "app.builderx.ogfa.camerapipelinetest"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        prefab true
    }
    ndkVersion "28.2.13676358"
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.libjpeg.turbo
    implementation libs.okhttp
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

