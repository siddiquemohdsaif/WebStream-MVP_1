def downsample3To2Spv = file("src/main/assets/downsample_3to2.comp.spv")
def downsample1To1Spv = file("src/main/assets/downsample_1to1.comp.spv")
def resizePlaneSpv = file("src/main/assets/resize_plane.comp.spv")
def yuv420To444Spv = file("src/main/assets/yuv420_to_yuv444.comp.spv")
