plugins {
    alias(libs.plugins.android.application)
}

def glslang = new File(System.getenv("LOCALAPPDATA"),
        "Android/Sdk/emulator/lib64/vulkan/glslangValidator.exe")
def cameraVert = file("src/main/shaders/camera.vert")
def cameraFrag = file("src/main/shaders/camera.frag")
def cameraVertSpv = file("src/main/assets/camera.vert.spv")
def cameraFragSpv = file("src/main/assets/camera.frag.spv")

tasks.register("compileCameraVertexShader", Exec) {
    inputs.file(cameraVert); outputs.file(cameraVertSpv)
    doFirst { cameraVertSpv.parentFile.mkdirs() }
    commandLine glslang.absolutePath, "-V", "--target-env", "vulkan1.0",
            cameraVert.absolutePath, "-o", cameraVertSpv.absolutePath
}
tasks.register("compileCameraFragmentShader", Exec) {
    inputs.file(cameraFrag); outputs.file(cameraFragSpv)
    doFirst { cameraFragSpv.parentFile.mkdirs() }
    commandLine glslang.absolutePath, "-V", "--target-env", "vulkan1.0",
            cameraFrag.absolutePath, "-o", cameraFragSpv.absolutePath
}

